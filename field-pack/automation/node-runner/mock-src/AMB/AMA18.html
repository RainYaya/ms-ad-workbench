<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Cache-Control" content="no-cache" />
<meta http-equiv="Content-Type" content="text/html; charset=Shift_JIS" />
<meta http-equiv="Pragma" content="no-cache" />
<title></title>
<link rel="stylesheet" type="text/css" href="/static/css/mhk.css"/>
<base target="_self"/>
<script type="text/javascript" src="/static/js/mhk_common.js"></script>
<script>
function custom_Load() {
	// ウィンドウの×ボタンを無効化
	commonPopupBodyOnload();

	var	form = document.mhk_MHKPRForm;

	// 検索結果表、頁ボタン表示制御
	var	gyoumu_list = document.getElementById('gyoumu_list');
	// 件数0件の場合における検索結果欄・選択ボタンの非表示制御
	if ( parseInt(form.totalCount.value) == 0 ) {
		gyoumu_list.style.visibility = "hidden";
		form.closeSelect.style.visibility = "hidden";
	} else {
		gyoumu_list.style.visibility = "visible";
		form.closeSelect.style.visibility = "visible";
	}
	// 前頁ボタン制御(ページ番号 > 1のみ表示)
	if ( parseInt(form.pageNumber.value) > 1 ) {
		form.prevPage.style.visibility = "visible";
	} else {
		form.prevPage.style.visibility = "hidden";
	}
	// 次頁ボタン制御(ページ番号 > 1のみ表示)
	if ( parseInt(form.totalPage.value) > parseInt(form.pageNumber.value) ) {
		form.nextPage.style.visibility = "visible";
	} else {
		form.nextPage.style.visibility = "hidden";
	}

	// 業務エリアを非表示にする場合
	if( form.hide_gyoumu_area_flag.value == '1') {

		// 業務エリア
		var area = document.getElementById('gyoumu_area');

		area.style.visibility = 'hidden';
		form.prevPage.style.visibility = "hidden";
		form.nextPage.style.visibility = "hidden";
	}
}

function popupCloseSelect() {

	// 親画面終了チェック
	if (!windowOpenerClosedCheck()) {
		return false;
	}

	var	form = document.mhk_MHKPRForm;
	var	selectNo = null;

	if ( document.getElementsByName('selectNo').length == 1 ) {
		if ( form.selectNo.checked ) {
			selectNo = form.selectNo.value;
		}
	} else {
		selectNo = getRadioSelectedValue(form.selectNo);
	}

	if (selectNo == null) {
		// エラー時のフォーカス先について
		// 複数のラジオボタンが対象になってしまうため、選択ボタンとする。
		showValidateMessage(form, form.closeSelect, '');
		return;
	}

	window.opener.document.mhk_MHKPRForm.field_agent_id.value = form['list[' + selectNo + '].field_agent_id'].value;
	window.opener.document.getElementById('field_agent_name').innerText = form['list[' + selectNo + '].field_agent_name'].value;
	window.opener.document.getElementById('field_agent_name').title = form['list[' + selectNo + '].field_agent_name'].value;

	// サーバ更改で追加（振分検索例外時のため）
	if (oyawin == 'AMA04') {
		window.opener.document.getElementById('field_agent_name_post').value = form['list[' + selectNo + '].field_agent_name'].value;
	}

	window.close();
}

function popupClose(button) {
	window.close();
}

// 検索(前頁、次頁)のバリデート
function searchValidate(form) {
	// 部店課支社ｺｰﾄﾞ
	if (!isRequired(form, form.section_code_key, '') ||
		 !isMinLenB(form, form.section_code_key, 5, '') ||
		 !isAlphaNumeric(form, form.section_code_key, '') ) {
		return false;
	}

	// 代理店ｺｰﾄﾞ
	if ( !isAlphaNumeric(form, form.agent_code_key, '') ) {
		return false;
	}

	// 募集人ID
	if (!isMinLenB(form, form.field_agent_id_key, 3, '') ||
		 !isAlphaNumeric(form, form.field_agent_id_key, '') ) {
		return false;
	}

	// 募集人名
	if (!isMaxLenB(form, form.field_agent_name_key, 400, '') ||
		!isProhibitionChar(form, form.field_agent_name_key, '') ) {
		return false;
	}

	return true;
}

function custom_Submit(form) {

	// 親画面終了チェック
	if (!windowOpenerClosedCheck()) {
		return false;
	}

	// 検索ボタン押下時
	if (clickButtonName == 'search' ||
		clickButtonName == 'nextPage' ||
		clickButtonName == 'prevPage') {
		// メッセージエリアのメッセージをクリア
		document.getElementById('popup_message_area').innerHTML = '&nbsp;';

		// 検索条件のバリデートを実行
		return searchValidate(form);
	}
}
</script>
</head>

				<input type="hidden" />

	<input type="hidden" id="hide_gyoumu_area_flag" name="hide_gyoumu_area_flag" />

	<!--/* ボタンエリア */-->
