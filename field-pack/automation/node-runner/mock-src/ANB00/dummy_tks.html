		var		developMode = false;

		function onbodyLoad() {

			form.userID.value = getCookie('usr');
			form.bukaCode.value = getCookie('buk');

		function getCookie(cookieName) {
			var	i;
			var	cookies	= document.cookie.split(';');
			var	result	= '';

			for (i = 0 ; i < cookies.length ; i++ ) {
				var	cookie	= cookies[i];
				var	index	= cookie.indexOf('=');

				var	searchCookieName = cookie.substring(0, index);

				if ( searchCookieName == cookieName ||
					 searchCookieName == ' ' + cookieName ) {
					result = cookie.substring(index + 1);
					break;
				}
			}
			return result;
		}

		function normalWindow(daihituFlag) {
			var		form = document.mainForm;

			setCookie('usr', form.userID.value, EXPIRES_DAY);
			setCookie('buk', form.bukaCode.value, EXPIRES_DAY);
			setCookie('pst', form.postCode.value, EXPIRES_DAY);

			if (form.accessMS.checked) {
				setCookie('access-ms', form.accessMS.value, EXPIRES_DAY);
			} else {
				setCookie('access-ms', '', EXPIRES_DAY);
			}

			if (form.accessAD.checked) {
				setCookie('access-ad', form.accessAD.value, EXPIRES_DAY);
			} else {
				setCookie('access-ad', '', EXPIRES_DAY);
			}

			// 環境を判定し遷移先を振り分け（Local/Server）
			var host    = location.hostname;
			// ローカルを表すhost文字列
			var patternLocal = /local/;
			// MSを表すhost文字列
			var patternMS = /ms\./;
			var url = '';

			if (host.match(patternLocal)) {
				// ローカル環境の場合
				if (daihituFlag == '1') {
					// 代筆・代印の場合
					url = './ANA05?gamid=ANA05&gamcd=ANA00';
				} else {
					url = './ANA01?gamid=ANA01&gamcd=ANA00';
				}
			} else {
				// サーバ環境の場合
				if (host.match(patternMS)) {
					// MSの場合
					url = '/tksroot/index.html';
				} else {
					// ADの場合
					url = '/tksroot/index_AD.html';
				}

				if (daihituFlag == '1') {
					// 代筆・代印の場合
					url = url + '?mode=1';
				}
			}

			window.open(url, 'TOP', 'width=900,height=640,status=yes');
		}

		function setCookie(cookieName, value, expiresDay) {
			var		expiresDate = new Date();
			expiresDate.setDate(expiresDate.getDate() + expiresDay);
			document.cookie = cookieName + '=' + value + '; path=/; expires=' + expiresDate.toGMTString();
		}

  <body bgcolor="#FFFFFF" onload="onbodyLoad()">
    	<form name="mainForm">
    		<table>
    		<tr>

	    		<td><input type="text" name="userID" value=""/></td>
    		</tr>

	    		<td><input type="text" name="bukaCode" value=""/></td>
