function custom_Load()
{
	// ウィンドウの×ボタンを無効化
	commonPopupBodyOnload();

	// 画面を閉じるときに親画面の再描画を行う
	window.onbeforeunload = function () {
		if (clickButtonName != 'CopyClipboard') {
			initialSelfClick();
		}
	};

	var hideGyoumuAreaFlag = document.getElementById('hide_gyoumu_area_flag');

	// 業務エリアを非表示にする場合
	if(hideGyoumuAreaFlag.value == '1') {

		// 業務エリア
		var area = document.getElementById('gyoumu_area');

		// 出力ボタン
		var button = document.getElementById('Print');

		// クリップボードへコピーボタン
		var copyButton = document.getElementById('CopyClipboard');

		area.style.visibility = 'hidden';
		button.style.visibility = 'hidden';
		copyButton.style.visibility = 'hidden';

		return;
	}

	// 以下、業務エリアを表示する場合

	// 代理店対応＝「照会」の場合の値
	var FLG_SYOKAI = '1';

	// 代理店対応フラグを取得
	var agentDealFlag = document.getElementById('agent_deal_flag');

	// 非活性制御（照会・返送票）
	document.getElementById('report_type_1').disabled = (agentDealFlag.value != FLG_SYOKAI);

	// 非活性制御（照会・返送票　FAX用）
	document.getElementById('report_type_4').disabled = (agentDealFlag.value != FLG_SYOKAI);

	// 非活性制御（連絡票）
	document.getElementById('report_type_2').disabled = (agentDealFlag.value == FLG_SYOKAI);

	// 非活性制御（督促票）
	document.getElementById('report_type_3').disabled = (agentDealFlag.value != FLG_SYOKAI);

	// 非活性制御（督促票　FAX用）
	document.getElementById('report_type_5').disabled = (agentDealFlag.value != FLG_SYOKAI);

	// 帳票種類　選択状態プリセット
	var report_type_for_check = document.getElementById('report_type_for_check').value;
	switch (report_type_for_check) {

	// 照会・返送票
	case '1':
		document.getElementById('report_type_1').checked = true;
		break;
	// 照会・返送票　FAX用
	case '4':
		document.getElementById('report_type_4').checked = true;
		break;
	// 連絡票
	case '2':
		document.getElementById('report_type_2').checked = true;
		break;
	// 督促票
	case '3':
		document.getElementById('report_type_3').checked = true;
		break;
	// 督促票　FAX用
	case '5':
		document.getElementById('report_type_5').checked = true;
		break;
	}

	// 非活性制御（回答締切日（督促日））
	document.getElementById('reminder_date_flag').disabled   = (agentDealFlag.value != FLG_SYOKAI);

	// 非活性制御（照会不要項目）
	document.getElementById('inquiry_unnecessary_flag').disabled = false;

	// 表示制御（タイトル選択）
	if (document.getElementById('company_kbn').value == 'AD') {
		// AD時のみ表示
		document.getElementById("titleTypeArea").style.display = 'grid';
		document.getElementById("gyoumu_area").classList.remove = 'wrapper14_ms';
		document.getElementById("gyoumu_area").classList.add = 'wrapper14_ad';

		// 入力区分が「その他(9)」の場合のみ、「その他不備」を活性化する
		var INPUT_TYPE_OTHER = '9';
		if ( document.getElementById('input_type').value == INPUT_TYPE_OTHER ) {
			document.getElementById('title_type_9').disabled = false;
		}
	}

	// 非表示制御（「クリップボードへコピー」ボタン
	if ( agentDealFlag.value != FLG_SYOKAI ) {
		// 代理店対応 !=「照会」の場合、「クリップボードへコピー」ボタンを非表示にする
		document.getElementById('CopyClipboard').style.visibility = "hidden";
	}

	// クリップボード表示用のデータ取得
	var clipboardCopyData = document.getElementById('clipboard_data').value;

	// クリップボード表示用のデータあり？
	if ( clipboardCopyData != '' ) {
		// ダイアログ表示
		var onDialog = document.getElementById('onDialog');
		onDialog.click();
	}
}

function custom_Submit(form) {
	// 親画面終了チェック
	if (!windowOpenerClosedCheck()) {
		return false;
	}

	var tel = document.getElementById("user_tel");
	var fax = document.getElementById("user_fax");
	var sectionName = document.getElementById("user_section_name");
	var messageField = document.getElementById("notification_print_message");

	// TELの半角数字と「-（ハイフン）」チェック
	if (typeof(tel) != 'undefined') {
		if ( !isNumericHyphen(form, tel, '') ) {
			return false;
		}
	}

	// FAXの半角数字と「-（ハイフン）」チェック
	if (typeof(fax) != 'undefined') {
		if ( !isNumericHyphen(form, fax, '') ) {
			return false;
		}
	}

	// 課支社名の最大バイト数チェック
	if(!isMaxLenB(form, sectionName, 28, '')) {
		return false;
	}

	// 課支社名の記号チェックチェック
	if(!isProhibitionChar(form, sectionName, '')) {

		return false;
	}

	// 帳票印刷用　備考・通信欄の最大バイト数チェック
	if(!isMaxLenB(form, messageField, 1296, '')) {
		return false;
	}

	// 帳票印刷用　備考・通信欄の記号チェックチェック
	if(!isProhibitionChar(form, messageField, '')) {

		return false;
	}

	// 印刷ボタン押下時
	if ( clickButtonName == 'Print' ) {
		// アクティブなボタンからフォーカスをはずす
		document.activeElement.blur();
		// ターゲットをダウンロードフレームに変更する
		AZG901Base.target = "downloadFrame";
	}
	// クリップボードへコピーボタン押下時
	else if ( clickButtonName == 'CopyClipboard' ) {
		// 確認メッセージを表示
		if ( !window.confirm('') ) {
			return false;
		}
		// ターゲットを自分自身に変更する
		AZG901Base.target = "_self";
	}
	// その他の場合
	else {
		// ターゲットを自分自身に変更する
		AZG901Base.target = "_self";
	}

	return true;
}

function dialogClose() {

	window.close();
}

// 課支社の情報を表示チェックボックス
function checkBoxOnclick() {
    if (document.getElementById('section_Info_flag').checked == true) {

        // 入力情報を退避
        document.getElementById('tel').value = document.getElementById('user_tel').value;
        document.getElementById('fax').value = document.getElementById('user_fax').value;
        document.getElementById('section_name').value = document.getElementById('user_section_name').value;

        document.getElementById('user_tel').value = document.getElementById('treatment_tel').value;
        document.getElementById('user_fax').value = document.getElementById('treatment_fax').value;
        document.getElementById('user_section_name').value = document.getElementById('treatment_section_name').value;
    } else {
        document.getElementById('user_tel').value = document.getElementById('tel').value;
        document.getElementById('user_fax').value = document.getElementById('fax').value;
        document.getElementById('user_section_name').value = document.getElementById('section_name').value;
    }
}

// クリップボードにデータコピー
function copyClipboard() {
	var clipboardCopyData = document.getElementById('clipboard_data').value;
	var userAgent = window.navigator.userAgent.toLowerCase();

	// IE
	if (userAgent.indexOf("msie") != -1 || userAgent.indexOf("trident") != -1) {
		window.clipboardData.setData('text', clipboardCopyData);
	// Edge
	} else if (userAgent.indexOf("edg") != -1 || userAgent.indexOf("edge") != -1) {
		// HTTP・HTTPS確認
		if (window.isSecureContext && navigator.clipboard.writeText) {
			navigator.clipboard.writeText(clipboardCopyData);
		} else {
			const textarea = document.createElement('textarea');
			textarea.value = clipboardCopyData;
			textarea.style.opacity = 0;
			document.body.appendChild(textarea);
			textarea.focus();
			textarea.select();
			document.execCommand('copy');
			document.body.removeChild(textarea);
		}
	}
}

// クリップボードへコピー用ダイアログ
document.addEventListener('DOMContentLoaded', function() {
	var dialog = document.getElementById('dialog_clipboard');
	var dialogMsg = ''
	var clipboardUsableFlag = true;

	if (!navigator.clipboard && !document.execCommand) {
		dialogMsg = '本環境はクリップボード機能がサポートされていないため、データの作成ができません。';
		clipboardUsableFlag = false;
	}

	document.getElementById('dialog_msg').textContent = dialogMsg;
	dialog.addEventListener('close', (event) => {
		var dialog = event.target;
		var returnValue = dialog.returnValue;
		if (returnValue === 'OK' && clipboardUsableFlag) {
			copyClipboard();
		}
	});
});
</script>
