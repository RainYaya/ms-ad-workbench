<script>
function onCloseClick() {
	clickButtonName = 'close';
	return closeSubmit(document.mhk_MHKPRForm.close, '');
}

// 画面ロード時の初期処理
function custom_bodyLoad() {
    commonBodyOnload();
	var	form = document.mhk_MHKPRForm;

	document.images['title_logo'].src = form.logo_pass.value;

	var	gyoumu_list = document.getElementById('gyoumu_list');
	// 件数0件の場合における検索結果欄の非表示制御
	if ( parseInt(form.totalCount.value) == 0 ) {
		gyoumu_list.style.visibility = "hidden";
	}
	else {
		gyoumu_list.style.visibility = "visible";
	}
	// 前頁ボタン制御(ページ番号 > 1のみ表示)
	if ( parseInt(form.pageNumber.value) > 1 ) {
		form.prevPage.style.visibility = "visible";
	}
	else {
		form.prevPage.style.visibility = "hidden";
	}
	// 次ページボタン制御(ページ番号 > 1のみ表示)
	if ( parseInt(form.totalPage.value) > parseInt(form.pageNumber.value) ) {
		form.nextPage.style.visibility = "visible";
	}
	else {
		form.nextPage.style.visibility = "hidden";
	}
	var	intervals = document.getElementById('locationReloadIntervals').value;
	setTimeout('reload()', intervals);
}

function reload() {
    var hiddenButton = document.mhk_MHKPRForm.hiddenButtonForReload;
    if(hiddenButton != null) {
        hiddenButton.click();
    }
}

// 検索(前頁、次頁、完了登録含む)のバリデート
function searchValidate() {
	var form = document.mhk_MHKPRForm;
	// 予約番号
	if ( !isLenB(form, form.reserve_no_key, 12, '') ||
		 !isAlphaNumeric(form, form.reserve_no_key, '') ) {
		return false;
	}
	return true;
}

function custom_Submit(form) {
	// 終了ボタン押下
	if ( clickButtonName == '204toClose' ) {
		if ( window.confirm('') ) {
			return true;
		} else {
			return false;
		}
	} else if (	clickButtonName == 'select'		||
				clickButtonName == 'nextPage'	||
				clickButtonName == 'prevPage') {
		// メッセージエリアのメッセージをクリア
		document.getElementById('message_area').innerText = '';
		// 検索条件のバリデートを実行
		return searchValidate();
	} else {
		// 削ボタン、再実行、ダウンロード押下時は予約番号、ファイル名を設定する
		if (clickButtonName != null && clickButtonName != "" && clickButtonName != "act204to001"
				&& clickButtonName != "act204to103" && clickButtonName != "close" && clickButtonName != "link103") {
			// メッセージエリアのメッセージをクリア
		    document.getElementById('message_area').innerText = '';
			var indexNo = getNameToIndexNo(clickButtonName);
			if ( !isNaN(indexNo) ) {
				var	form = document.mhk_MHKPRForm;
		    	form.selected_reserve_no.value = form['tableRecordList[' + indexNo + '].reserve_no'].value;
		    	form.selected_file_name.value = form['tableRecordList[' + indexNo + '].file_name'].value;
		    	var selectKey = '「reserve_no='+form['tableRecordList[' + indexNo + '].reserve_no'].value;
		    	selectKey = selectKey + ',total_year_month_from='+form['tableRecordList[' + indexNo + '].total_year_month_from'].value;
		    	selectKey = selectKey + ',total_year_month_to='+form['tableRecordList[' + indexNo + '].total_year_month_to'].value;
		    	selectKey = selectKey + ',large_item_code='+form['tableRecordList[' + indexNo + '].large_item_code'].value;
		    	selectKey = selectKey + ',large_item_remove='+form['tableRecordList[' + indexNo + '].large_item_remove'].value;
		    	selectKey = selectKey + ',input_type_flag='+form['tableRecordList[' + indexNo + '].input_type_flag'].value;
		    	selectKey = selectKey + ',application_form_type_flag='+form['tableRecordList[' + indexNo + '].application_form_type_flag'].value;
		    	selectKey = selectKey + ',total_unit_flag='+form['tableRecordList[' + indexNo + '].total_unit_flag'].value;
		    	selectKey = selectKey + ',output_target_flag='+form['tableRecordList[' + indexNo + '].output_target_flag'].value;
		    	selectKey = selectKey + '」';
		    	form.select_key.value = selectKey;
		    }
		    // 削除ボタン押下時
			if (clickButtonName.length > 6 && clickButtonName.slice(0,6) == 'delete') {
				// 確認ダイアログ
				if (window.confirm('')) {
					return true;
				} else {
					// キャンセル選択
					return false;
				}
			}
			else if(clickButtonName.length > 8 && clickButtonName.slice(0,8) == 'download') {
				// アクティブなボタンからフォーカスをはずす
				document.activeElement.blur();
			}
		}
		return true;
	}
}

//「再実行」ボタンsubmit
function submitUpdate() {

//「ﾀﾞｳﾝﾛｰﾄﾞ」ボタンsubmit
function submitDownload() {

}

//「No」リンクsubmit
function submitLink103(value) {

    var hiddenButton = document.mhk_MHKPRForm.hiddenButtonForLink103;
    if(hiddenButton != null) {
    	hiddenButton.click();
    }
}
