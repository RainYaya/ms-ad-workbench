<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head><link rel="icon" href="data:,"><style>img[data-unresolved-src]{display:none}</style><script>window.opener=window.opener||window;</script>
<meta http-equiv="Cache-Control" content="no-cache" />
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta http-equiv="Pragma" content="no-cache" />
<title></title>
<link rel="stylesheet" type="text/css" href="static/css/mhk.css"/>
<base target="_self" />
<script type="text/javascript" src="static/js/mhk_common.js"></script>
<script>
function bodyOnload() {
	// ウィンドウの×ボタンを無効化
	commonPopupBodyOnload();

	var form = document.mhk_MHKPRForm;
	var indexNo = document.getElementById('index_no').value;

	var oyaForm = window.opener.document.mhk_MHKPRForm;
	document.getElementById("inquiry_content_code").innerText
		= oyaForm['list[' + indexNo + '].inquiry_contents_code'].value;
	document.getElementById("inquiry_content_name").innerText
		= oyaForm['list[' + indexNo + '].inquiry_contents_name_mst'].value;
	form.inquiry_content_name_edit.value
		= oyaForm['list[' + indexNo + '].inquiry_contents_name'].value;

	//window.returnValue = null;

	var hideGyoumuAreaFlag = document.getElementById('hide_gyoumu_area_flag');

	// 業務エリアを非表示にする場合
	if( form.hide_gyoumu_area_flag.value == '1') {

		// 業務エリア
		var area = document.getElementById('gyoumu_area');

		// 選択ボタン
		var button = form['ok'];

		area.style.visibility = 'hidden';
		button.style.visibility = 'hidden';
	}
}

function popupClose(button) {
	// 親画面終了チェック
	if (!windowOpenerClosedCheck()) {
		return false;
	}

	var form = document.mhk_MHKPRForm;
	var oyaForm = window.opener.document.mhk_MHKPRForm;

	if (button.name == 'ok') {
		// OKボタン押下時

		if (formValidate(form)) {
			// 入力チェック正常

			// 照会内容の改行削除
			var editValue = form.inquiry_content_name_edit.value.replace(new RegExp('\r\n|\n', 'igm'), '');

			var indexNo = document.getElementById('index_no').value;
			// 照会内容
			var inquiryContentsNameElement  = window.opener.document.getElementById('td_inquiry_contents_name[' + indexNo + ']');
			inquiryContentsNameElement.innerText    = (editValue == '' ? ' ' : editValue);
			// 任意照会内容
			oyaForm['list[' + indexNo + '].inquiry_contents_name_edit'].value  = editValue;
			// 20180322 WF更改で追加
			oyaForm['tableRecordList[' + indexNo + '].inquiry_contents_name_edit'].value    = editValue;
			oyaForm['list[' + indexNo + '].inquiry_contents_name'].value   = editValue;
			// 20180322 WF更改で追加
			oyaForm['tableRecordList[' + indexNo + '].inquiry_contents_name'].value = editValue;

			window.close();
		}
	} else {
		window.close();
	}
}

// 入力チェック
function formValidate(form) {

	// 編集照会内容のバイト数チェック＆記号チェック
	if (!isMaxLenBWithoutRegExp(form, form.inquiry_content_name_edit, 342, new RegExp('\r\n|\n', 'igm'), '') ||
		!isProhibitionChar(form, form.inquiry_content_name_edit, '') ) {
		return false;
	}
	return true;
}
</script>
</head>
<body class="popup_body_common" onload="bodyOnload()">
<form id="mhk_MHKPRForm" name="mhk_MHKPRForm" method="post" onsubmit="return submitAZG902(this,null);" >

  <input type="hidden" />

  <!--/* メッセージエリア */-->
  <div class="popup_message_area">
    
        <ul class="message_area">
            <li class="message_area"></li>
        </ul>
    1
  </div>

	<!--/* 業務画面共通項目 */-->
	<input type="hidden" id="GateFLG"      name="GateFLG"      value="0" />
	<input type="hidden" id="ai21__aid"    name="ai21__aid"    value="" />
	<input type="hidden" id="ai21__gid"    name="ai21__gid"    value="AMA15" />
	<input type="hidden" id="ai21__data"   name="ai21__data"   value="" />
	<input type="hidden" id="dousaMode"    name="dousaMode"    value="" />
	<input type="hidden" id="gamcd"        name="gamcd"        value="AMA00" />
	<input type="hidden" id="gamid"        name="gamid"        value="AMA15" />
	<input type="hidden" id="hubsessid"    name="hubsessid" />
	<input type="hidden" id="H0000A_Z6"    name="h0000A_Z6" />
	<input type="hidden" id="H0000A_Z6_M"  name="h0000A_Z6_M" />
	<input type="hidden" id="pfkey"        name="pfkey" />
	<input type="hidden" id="seniType"     name="seniType" />
	<input type="hidden" id="sys_mode"     name="sys_mode" />
	<input type="hidden" id="H0000_NEXTGM" name="h0000_NEXTGM" />

	<!--/* 業務エリア */-->
	<div id="gyoumu_area" class="wrapper15">
		<div class="item">
			<div class="gyoumu_field_title">照会ｺｰﾄﾞ</div>
			<div id="inquiry_content_code" class="gyoumu_field_value_left">
			</div>
			<div class="gyoumu_field_title">照会内容</div>
			<div id="inquiry_content_name" class="gyoumu_field_value_left">
			</div>
		</div>
		<div class="item separator"></div>
		<div class="item">
			<div class="gyoumu_field_title">編集照会内容<br />(171文字以内)</div>
			<div class="gyoumu_field_value">
				<textarea name="inquiry_content_name_edit" class="gyoumu_field_control"></textarea>
			</div>
		</div>
	</div>

	<input type="hidden" id="hide_gyoumu_area_flag" name="hide_gyoumu_area_flag" />
	<input type="hidden" id="index_no" name="index_no" />

	<!--/* ボタンエリア */-->
	<div id="ButtonP" class="popup_button_area size_button_area15">
		<!--/* 共通ボタン */-->
		<div class="button_width_60">
			<input name="ok" type="button" class="popup_button_area_button" value="　ＯＫ　" onclick="popupClose(this);" />
		</div>
		<!--/* 終了ボタン */-->
		<div class="button_width_75">
			<input name="cancel" type="button" class="popup_button_area_button" value="キャンセル" onclick="popupClose(this);" />
		</div>
	</div>

</form>
<script src="../../picker.js"></script></body>

</html>
