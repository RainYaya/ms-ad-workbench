<script>

function bodyOnload() {
	commonBodyOnload();

	var form = document.mhk_MHKPRForm;

	// 検索結果0件、または100件を超える場合
	if ((parseInt("1") == 0 || parseInt("1") > 99)
			&& form.section_mail_send_flag.value == "1") {
		document.getElementById("sendCount").style.backgroundColor= "#ffff00";
		document.getElementById("sendCount").style.color = "#ff0000";
		document.getElementById("sendCount").style.fontWeight = "bold";
	}

	if (form.prevPage) {
		// 前頁ボタン制御(ページ番号 > 1のみ表示)
		if ( parseInt(form.page_no.value) > 1 ) {
			form.prevPage.style.visibility = "visible";
		} else {
			form.prevPage.style.visibility = "hidden";
		}

		// 次ページボタン制御(ページ番号 > 1のみ表示)
		if ( parseInt(form.total_page.value) > parseInt(form.page_no.value) ) {
			form.nextPage.style.visibility = "visible";
		} else {
			form.nextPage.style.visibility = "hidden";
		}
	}

	// メール通知要否切り替え
	changeMailSend();
}

function onCloseClick() {
	clickButtonName = 'close';
	return closeSubmit(document.mhk_MHKPRForm.close, '');
}

//検索のバリデート
function searchValidate(form) {

  // 課支社CD
  if (!isRequired(form, form.section_code, '') ||
	 !isMinLenB(form, form.section_code, 5, '') ||
     !isAlphaNumeric(form, form.section_code, '') ) {
    return false;
  } else {
	return true;
  }

}

function custom_Submit(form) {

	var  form = document.mhk_MHKPRForm;

	// 検索ボタン押下時
	if (clickButtonName == 'search') {
		if (searchValidate(form)) {
			return true;
		} else {
			return false;
		}
	}


	// 所属課支社別メール通知一覧の値をinputHiddenに退避
	var sectionUserMailSendFlagParam = "";
	var sectionUserIdParam = "";

	var i = 0;

	while (document.getElementById("sectionUser:user_mail_send_flag_" + i)) {
		if (sectionUserMailSendFlagParam) {
			sectionUserMailSendFlagParam += ',';
			sectionUserIdParam += ',';
		}
		sectionUserMailSendFlagParam += document.getElementById("sectionUser:user_mail_send_flag_" + i).checked ? '1' : '0';
		sectionUserIdParam += document.getElementById("sectionUser:user_id_" + i).value;

		i++;
	}

	document.getElementById("sectionUser_user_mail_send_flag").value = sectionUserMailSendFlagParam;
	document.getElementById("sectionUser_user_id").value = sectionUserIdParam;

	// 個別メール通知一覧の値をinputHiddenに退避
	var addUserMailSendFlagParam = "";
	var addSectionCodeParam = "";
	var addUserNameParam = "";
	var addUserIdParam = "";

	i = 0;


	while (document.getElementById("addUser:user_mail_send_flag_" + i)) {
		if (addUserMailSendFlagParam) {
			addUserMailSendFlagParam += ',';
			addSectionCodeParam += ',';
			addUserNameParam += ',';
			addUserIdParam += ',';
		}
		addUserMailSendFlagParam += document.getElementById("addUser:user_mail_send_flag_" + i).checked ? '1' : '0';
		addSectionCodeParam += document.getElementById("addUser:section_code_" + i).value;
		addUserNameParam += document.getElementById("addUser:user_name_" + i).value;
		addUserIdParam += document.getElementById("addUser:user_id_" + i).value;

		i++;
	}

	document.getElementById("addUser_user_mail_send_flag").value = addUserMailSendFlagParam;
	document.getElementById("addUser_section_code").value = addSectionCodeParam;
	document.getElementById("addUser_user_name").value = addUserNameParam;
	document.getElementById("addUser_user_id").value = addUserIdParam;

	return true;
}

// 個別メール通知先画面POPUP表示
function searchUser() {

	// 子画面開閉チェック
	subWinOpenCheck();

	var url = new URL('', window.location.origin);

	showPopup(url.href, "AMA27", "1");
}

// メール通知要否切り替え
function changeMailSend() {
	var form = document.mhk_MHKPRForm;

	if (form.section_mail_send_flag_radio) {
		// ラジオボタンで選択中の値を取得する
		var sectionMailSendFlag = getRadioSelectedValue(form.section_mail_send_flag_radio);

		form.section_mail_send_flag.value = sectionMailSendFlag;

		var disabledFlag = (sectionMailSendFlag == "0");

		if(form.all_select){
			// 全選択
			document.getElementById("all_select").disabled = disabledFlag;
			// 全解除
			document.getElementById("all_clear").disabled = disabledFlag;
		}
		// 追加
		document.getElementById("add_user").disabled = disabledFlag;

		// 所属課支社別メール通知先一覧
		var i = 0;
		while (document.getElementById("sectionUser:user_mail_send_flag_" + i)) {
			document.getElementById("sectionUser:user_mail_send_flag_" + i).disabled = disabledFlag;
			i++;
		}

		// 個別メール通知先一覧
		i = 0;
		while (document.getElementById("addUser:user_mail_send_flag_" + i)) {
			document.getElementById("addUser:user_mail_send_flag_" + i).disabled = disabledFlag;
			i++;
		}

		// メール通知を否にしたとき子画面開閉チェックを行う
		if(disabledFlag) {
			subWinOpenCheck();
		}
	}

}

function change_all_flags() {
	var i = 0;
	// 全選択／全解除ボタン押下
	if (clickButtonName == 'all_select') {

		while (document.getElementById("sectionUser:user_mail_send_flag_" + i)) {
			document.getElementById("sectionUser:user_mail_send_flag_" + i).checked = "checked";
			i++;
		}
	} else if (clickButtonName == 'all_clear') {

		while (document.getElementById("sectionUser:user_mail_send_flag_" + i)) {
			document.getElementById("sectionUser:user_mail_send_flag_" + i).checked = null;
			i++;
		}

	}
}
</script>
