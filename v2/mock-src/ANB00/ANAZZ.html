<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Cache-Control" content="no-cache" />
<meta http-equiv="Content-Type" content="text/html; charset=Shift_JIS" />
<meta http-equiv="Pragma" content="no-cache" />
<title>異例取扱管理システム　メニュー画面</title>
<link rel="stylesheet" type="text/css" href="/static/css/tks.css"/>
<script type="text/javascript" th:src='/static/js/tks_common.js'></script>
<script>
function onCloseClick() {
	return closeSubmit(document.tks_TKSPRForm.close, '');
}
function custom_BodyOnload() {
	commonBodyOnload();
}
</script>
</head>
<body leftmargin="5" topmargin="0" class="body_common" onload="custom_BodyOnload()">
<form id="tks_TKSPRForm" name="tks_TKSPRForm" method="post" action="">
  <input type="hidden" />
  <!--/* タイトル表示領域 */-->
  <div class="title_area">
    <div class="title_area_logo">
      <img name="title_logo" class="title_logo" src="/ANB00${commonForm.logoPath}" width="auto" height="32" alt="タイトルロゴ" />
    </div>
    <div class="title_area_title"> 異例取扱管理システム　メニュー画面 </div>
    <div class="title_area_sysinfo">
      <span>日時：
        1
        1画面ID：
        
        1
        v<br />
        利用者識別：1
      </span>
    </div>
  </div>
  <!--/* メッセージエリア */-->
  <div class="message_area" id="message_area">
    <div class="message_text">
      <ul class="message_area"><li class="message_area"></li></ul>
    </div>
  </div>
  <!--/* ボタン部 */-->
  <div class="button_area">
    <!--/* 共通ボタン */-->
    <div class="button_area_navigate">
    </div>
    <!--/* 処理実行ボタン */-->
    <div class="button_area_normal_operation">
    </div>
    <div class="button_area_delete_operation">
    </div>
    <!--/* 終了ボタン */-->
    <div class="button_area_end">
      <div class="button_area_button_length3"><input class="button_area_button" type="button" value="終　了" onclick="onCloseClick()"/></div>
    </div>
  </div>
  <input type="submit" id="close" name="close" formaction="/ANAZZ/close?dousaMode=&pfkey=child" style="display:none;" >
</form>
</body>

</html>
