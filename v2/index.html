<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>結合試験ワークベンチ</title>
<link rel="stylesheet" href="css/style.css?v=20261026.4">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">結</div>
    <div class="brand-copy">
      <h1>結合試験ワークベンチ</h1>
      <p id="breadcrumb">ダッシュボード</p>
    </div>
  </div>
  <div class="topbar-stats" id="topbarStats"></div>
  <div class="topbar-actions">
    <label class="search">
      <span>検索</span>
      <input id="globalSearch" type="search" placeholder="ID・画面・機能名で検索">
    </label>
    <button class="btn" id="btnTasks" type="button">タスク</button>
    <button class="btn" id="btnExport" type="button">JSON</button>
    <button class="btn" id="btnCsv" type="button">CSV</button>
    <label class="btn" for="importFile">インポート</label>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav id="nav">
      <button data-view="dashboard" class="nav-item active"><span class="nav-ico">◫</span>ダッシュボード</button>
      <button data-view="scenarios" class="nav-item"><span class="nav-ico">▤</span>シナリオ</button>
      <button data-view="routes" class="nav-item"><span class="nav-ico">⇢</span>実施順序</button>
      <button data-view="files" class="nav-item"><span class="nav-ico">▦</span>ファイル</button>
      <button data-view="tasks" class="nav-item"><span class="nav-ico">✓</span>自分のタスク</button>
      <button data-view="schedule" class="nav-item"><span class="nav-ico">⏱</span>日程</button>
      <button data-view="refs" class="nav-item"><span class="nav-ico">◇</span>参考資料</button>
      <button data-view="automation" class="nav-item"><span class="nav-ico">▶</span>自動化</button>
      <button data-view="manual" class="nav-item"><span class="nav-ico">◉</span>証跡・人工</button>
    </nav>
    <div class="side-block">
      <h3>絞り込み</h3>
      <label>領域
        <select id="filterDomain">
          <option value="">AZ + AY</option>
          <option value="AZ">AZ 申込書品質管理</option>
          <option value="AY">AY 異例取扱管理</option>
        </select>
      </label>
      <label>分類
        <select id="filterCategory"><option value="">すべて</option></select>
      </label>
      <label>会社
        <select id="filterCompany">
          <option value="">MS + AD</option>
          <option value="MS">MS（事業会社）</option>
          <option value="AD">AD（代理店）</option>
        </select>
      </label>
      <label>状態
        <select id="filterStatus">
          <option value="">すべて</option>
          <option value="NOT_STARTED">未実施</option>
          <option value="IN_PROGRESS">実施中</option>
          <option value="DONE">実施完了</option>
          <option value="VERIFIED">検証完了</option>
          <option value="BLOCKED">不可</option>
          <option value="NG">NG あり</option>
        </select>
      </label>
      <label class="check"><input id="filterAssigned" type="checkbox"> 自分のタスクのみ</label>
      <label class="check"><input id="filterMissing" type="checkbox"> データ欠損のみ</label>
      <label class="check"><input id="filterManual" type="checkbox"> 人工確認あり</label>
      <label class="check"><input id="filterManualOp" type="checkbox"> 人工操作あり</label>
      <label class="check"><input id="filterAutoOnly" type="checkbox"> 自動のみ</label>
      <label class="check"><input id="filterEvMissing" type="checkbox"> 証跡未取得</label>
      <label class="check"><input id="filterParamsAuto" type="checkbox"> 既定値 params のみ</label>
      <label class="check"><input id="filterRoute" type="checkbox"> 実施順序ありのみ</label>
      <label class="check"><input id="filterOld" type="checkbox"> 旧版を含む</label>
    </div>
    <div class="side-block side-note">
      <h3>データ</h3>
      <p id="dataMeta">読み込み中...</p>
      <button class="link-btn" id="btnValidation" type="button">データチェックを見る</button>
    </div>
  </aside>

  <main id="main" class="main">
    <div class="loading">データを読み込んでいます…</div>
  </main>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-panel">
    <header class="modal-head">
      <h2 id="modalTitle">データチェック</h2>
      <button class="icon-btn" id="modalClose" type="button" aria-label="閉じる">×</button>
    </header>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<div id="drawerBackdrop" class="drawer-backdrop"></div>
<aside id="caseDrawer" class="case-drawer" aria-hidden="true">
  <div class="drawer-top">
    <span id="drawerLabel">ケース</span>
    <div style="display:flex;align-items:center;gap:6px">
      <button class="btn" id="drawerPrev" type="button">前へ</button>
      <button class="btn" id="drawerNext" type="button">次へ</button>
      <button class="btn" id="drawerFull" type="button">全画面</button>
      <button class="icon-btn" id="drawerClose" type="button" aria-label="閉じる">×</button>
    </div>
  </div>
  <div id="drawerContent"></div>
</aside>

<div id="toast" class="toast hidden"></div>

<script src="data/index.js?v=20261023.3"></script>
<script src="data/refs.js?v=20261023.3"></script>
<script src="data/validation.js?v=20261023.3"></script>
<script src="data/automation.js?v=20261023.3"></script>
    <script src="data/summaries.js?v=20261024.1"></script>
    <script src="data/runner-defs.js?v=20261025.1"></script>
    <script src="data/schedule.js?v=20261024.1"></script>
    <script src="data/evidence.js?v=20261026.2"></script>
    <script src="data/params.js?v=20261026.3"></script>
<div id="lightbox" class="lightbox" hidden><button class="lightbox-close" id="lightboxClose" aria-label="閉じる">×</button><img id="lightboxImg" alt=""></div>
<script src="js/app.js?v=20261026.9"></script>
</body>
</html>
