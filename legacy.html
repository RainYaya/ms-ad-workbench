<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>結合試験手順書ビューアー</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><div class="header-inner"><div class="brand-icon" data-icon="layers"></div><div class="brand-copy"><h1>結合試験手順書ビューアー</h1><p id="breadcrumb">申込書品質管理 · AZ-510-01</p></div><div class="header-stats"><div class="count-box"><b id="docCount">0</b> 手順書</div><div class="count-box success"><b id="doneCount">0</b> 完了</div><button id="importOpen" class="import-button">JSON読込</button></div></div></header>
<div id="importPanel" class="import-panel hidden">
  <div class="panel-title">
    <div>
      <h2>データを読み込む</h2>
      <p>基本JSONとWorkflowフォルダをそれぞれ選択してください。</p>
    </div>
    <button id="importClose" type="button">×</button>
  </div>

  <div class="import-grid">
    <section class="import-section">
      <div class="import-section-title">
        <span class="import-step">1</span>
        <div>
          <h3>基本データ</h3>
          <p>scenario-master / document-master / test-documents</p>
        </div>
      </div>
      <input id="jsonFiles" type="file" accept=".json,application/json" multiple>
      <button id="importRun" type="button">基本JSONを読み込む</button>
      <div id="basicImportStatus" class="import-status">未読込</div>
    </section>

    <section class="import-section workflow-folder-section">
      <div class="import-section-title">
        <span class="import-step">2</span>
        <div>
          <h3>Workflowデータ</h3>
          <p>一括VBAが生成した workflows フォルダを選択</p>
        </div>
      </div>
      <input id="workflowFolder" type="file" accept=".json,application/json" webkitdirectory directory multiple>
      <button id="workflowFolderButton" type="button">Workflowフォルダを選択</button>
      <div id="workflowFolderStatus" class="import-status">
        <b>フォルダ未選択</b>
        <span>JSON 0件 / 識別 0件 / 読込済み 0件</span>
      </div>
    </section>
  </div>

  <div class="import-help">
    Workflow JSONは選択時に全件解析せず、手順書を開いた時だけ読み込みます。
  </div>
</div>
<main class="page-grid"><aside><div class="side-card"><div class="search-wrap"><span data-icon="search"></span><input id="searchInput" placeholder="ID・操作内容を検索"></div><div id="tree"></div></div></aside><section id="mainContent"><div class="loading">データを読み込んでいます...</div></section></main>
<script src="js/app.js"></script></body></html>
