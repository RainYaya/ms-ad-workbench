<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta http-equiv="Cache-Control" content="no-cache" />
<meta http-equiv="Content-Type" content="text/html; charset=Shift_JIS" />
<meta http-equiv="Pragma" content="no-cache" />
<title></title>
<link rel="stylesheet" type="text/css" href="/static/css/tks.css"/>
<script type="text/javascript" src="/static/js/tks_common.js"></script>
<script>

function custom_Load() {

	commonBodyOnload();

	var sumupType = document.tks_TKSPRForm.sumup_type;

	var i;

	for (i = 0; i < sumupType.length; i++) {
		if (sumupType[i].checked) {
			changeSumupType(sumupType[i]);
		}
	}
}

function custom_Submit(form) {

	// メニューボタンもしくは終了ボタン押下
	if ( clickButtonName == 'act201to001' ||  clickButtonName == 'close' ) {
		return true;
	}

	// 単体入力チェック

	// 集計内容
	if ( !isRequiredRadio(form, form.sumup_type, '')) {
      return false;
    }

	// 本部CD
	if ( !isAlphaNumeric(form, form.head_office_code, '') ) {
		return false;
	}

	// 課支社CD
	if ( !isMinLenB(form, form.section_code, 3, '') ||
	     !isAlphaNumeric(form, form.section_code, '') ) {
		return false;
	}

	// 代理店CD
	if ( !isAlphaNumeric(form, form.agent_code, '') ) {
		return false;
	}

	// 集計年(FROM)
	if ( !isRequired(form, form.from_sumup_year, '') ||
		 !isNumeric(form, form.from_sumup_year, '') ||
		 !isLenB(form, form.from_sumup_year, 4, '') ) {
		return false;
	}

	// 集計月(FROM)
	if ( !isRequired(form, form.from_sumup_month, '') ||
		 !isNumeric(form, form.from_sumup_month, '') ||
		 !isIntRange(form, form.from_sumup_month, 1, 12, '') ) {
		return false;
	}

	// 集計年(TO)
	if ( !isRequired(form, form.to_sumup_year, '') ||
		 !isNumeric(form, form.to_sumup_year, '') ||
		 !isLenB(form, form.to_sumup_year, 4, '') ) {
		return false;
	}

	// 集計月(TO)
	if ( !isRequired(form, form.to_sumup_month, '') ||
		 !isNumeric(form, form.to_sumup_month, '') ||
		 !isIntRange(form, form.to_sumup_month, 1, 12, '') ) {
		return false;
	}


	// 相関入力チェック

	// 本部CD
	// 課支社CD
	// 代理店CD
	{
		// 本部CD, 課支社CD, 代理店CD全て未入力の場合はエラー
		if (isEmptyField(form.head_office_code) &&
			isEmptyField(form.section_code) &&
			isEmptyField(form.agent_code)) {

			alert('');
			form.head_office_code.focus();
			return false;
		}
	}

	// 課支社CD
	// 代理店CD
	{
	    // 代理店CDが入力時は課支社CD必須
	    if (!isEmptyField(form.agent_code) &&
	        isEmptyField(form.section_code)) {

	        alert('');
			form.section_code.focus();
			return false;
		}
	}

	// 集計年(FROM)
	// 集計月(FROM)
	// 集計年(TO)
	// 集計月(TO)
	{
		var		from = 	('000' + form.from_sumup_year.value).slice(-4) +
						('0'   + form.from_sumup_month.value).slice(-2);

		var		to = 	('000' + form.to_sumup_year.value).slice(-4) +
						('0'   + form.to_sumup_month.value).slice(-2);

		// 集計年月(FROM) > 集計年月(TO) の場合はエラー
		if ( from > to ) {

			alert('');
			form.from_sumup_year.focus();
			return false;
		}
	}

	// 集計ボタン押下
	if ( clickButtonName == 'outputSumup' ) {
		// アクティブなボタンからフォーカスをはずす
		document.activeElement.blur();
	}

	return true;
}

function onCloseClick() {
	clickButtonName = 'close';
	return closeSubmit(document.tks_TKSPRForm.close, '');
}

function changeSumupType(sumupType) {
    var form = document.tks_TKSPRForm;

    if (sumupType.value == '1') {
        form.application_base_item_1.disabled = false;
        form.application_base_item_2.disabled = false;
        form.application_base_item_3.disabled = false;
        form.application_base_item_4.disabled = false;
        form.application_base_item_5.disabled = false;
        form.application_base_item_6.disabled = false;
    } else if (sumupType.value == '2') {
        form.application_base_item_1.disabled = true;
        form.application_base_item_2.disabled = true;
        form.application_base_item_3.disabled = true;
        form.application_base_item_4.disabled = true;
        form.application_base_item_5.disabled = true;
        form.application_base_item_6.disabled = true;
    } else {
        form.application_base_item_1.disabled = true;
        form.application_base_item_2.disabled = true;
        form.application_base_item_3.disabled = true;
        form.application_base_item_4.disabled = true;
        form.application_base_item_5.disabled = false;
        form.application_base_item_6.disabled = false;
    }
}

</script>

</head>
<body leftmargin="5" topmargin="0" class="body_common" onload="custom_Load()">
