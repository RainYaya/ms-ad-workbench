<script>

function custom_Load() {
  // ウィンドウの×ボタンを無効化
  commonPopupBodyOnload();
  window.returnValue = null;

  var  form = document.tks_TKSPRForm;

  // 検索結果表、頁ボタン表示制御
  var  gyoumu_list = document.getElementById('gyoumu_list');
  // 件数0件の場合における検索結果欄の非表示制御
  if (parseInt(form.totalCount.value) == 0 ) {
    gyoumu_list.style.visibility = "hidden";
  } else {
    gyoumu_list.style.visibility = "visible";
  }
  // 前頁ボタン制御(ページ番号 > 1のみ表示)
  if (parseInt(form.pageNumber.value) > 1 ) {
    form.prevPage.style.visibility = "visible";
  } else {
    form.prevPage.style.visibility = "hidden";
  }
  // 次頁ボタン制御(ページ番号 > 1のみ表示)
  if (parseInt(form.totalPage.value) > parseInt(form.pageNumber.value) ) {
    form.nextPage.style.visibility = "visible";
  } else {
    form.nextPage.style.visibility = "hidden";
  }

  // 業務エリアを非表示にする場合
  if (form.hide_gyoumu_area_flag.value == '1') {

    // 業務エリア
    var area = document.getElementById('gyoumu_area');

    area.style.visibility = 'hidden';
    form.prevPage.style.visibility = "hidden";
    form.nextPage.style.visibility = "hidden";
    form.del.style.visibility = "hidden";
    form.ok.style.visibility = "hidden";
    form.close.value = "閉じる"
  }
}

// クリックしたNoのユーザ名をリストに追加する
function selectNo(indexNo) {
  var  form = document.tks_TKSPRForm;

  var opt = document.getElementById("select_name_list").options;

  if (opt.length < 1) {
    opt.length = 1;
  } else {
    opt.length = opt.length + 1;
  }

  opt[opt.length - 1].value = form['list[' + indexNo + '].mail_address'].value
  opt[opt.length - 1].text = form['list[' + indexNo + '].user_name'].value
}


// 選択したユーザ名をリストから削除する
function deleteSelectedName() {
  var opt = document.getElementById("select_name_list").options;
  var idx = document.getElementById("select_name_list").selectedIndex;
  var listCount = 0;

  // 未選択の場合、処理を行わない
  if (idx == -1) {
    return;
  }

  for (i = 0; i < opt.length; i++) {
    // 削除対象外のオプションを設定
    if (opt[i].selected == false) {
      opt[listCount].value = opt[i].value;
      opt[listCount].text = opt[i].text;
      opt[listCount].selected = false;
      listCount++;
    }
  }

  // リストの長さを設定
  opt.length = listCount;

}

function popupClose(button) {
  var form = document.tks_TKSPRForm;
  var opt = document.getElementById("select_name_list").options;

  if (button.name == 'ok') {
    // OKボタン押下時

    var limit_count = parseInt(form.select_name_list_limit_count.value, 10);
    // 送信先(写)一覧設定ユーザ数が上限件数を超える場合はエラー
    if (!isNaN(limit_count) && opt.length > limit_count) {
      alert(form.limit_message.value);
      form.select_name_list.focus();
      return false;
    }

    // 1回目の押下: 確認メッセージを画面内に表示する（真機のポップアップMsg相当）
    if (form.ok_massage_shown.value != '1') {
      var messageArea = document.getElementById('popup_message_area');
      if (messageArea) {
        messageArea.innerText = form.ok_massage.value != ''
          ? form.ok_massage.value
          : 'MAYG901I001：送信先（写）を設定しました。';
        messageArea.className = 'popup_message_area popup_message_confirm';
      }
      form.ok_massage_shown.value = '1';
      return false;
    }

    // 2回目の押下: 呼出元へ送信先(写)を設定して閉じる
    var openerDoc = (window.opener && !window.opener.closed) ? window.opener.document : null;

    if (openerDoc && openerDoc.tks_TKSPRForm) {
      // CC送信先アドレス(カンマ区切り文字列)を作成
      var ccAddressItems = '';
      for (var i = 0; i < opt.length; i++) {
        if (ccAddressItems != '') {
          ccAddressItems += ',';
        }
        ccAddressItems += opt[i].value;
      }

      // CC送信先アドレスの要素生成
      var ccAddressElm = openerDoc.createElement("input");
      ccAddressElm.type = "hidden";
      ccAddressElm.name = "ccAddress";
      ccAddressElm.value = ccAddressItems;

      // フォームにCC送信先アドレス(カンマ区切り文字列)の要素追加
      openerDoc.tks_TKSPRForm.appendChild(ccAddressElm);

      // 呼出元の戻り送信ボタン（存在する場合のみ押下）
      var returnButton = openerDoc.getElementById(form.buttonName.value);
      if (!returnButton) {
        returnButton = openerDoc.getElementById('1');
      }
      if (returnButton) {
        returnButton.click();
      }
    }

    window.close();
    return false;

  } else {
    // キャンセルボタン押下時
    window.close();
    return false;
  }
}

// 検索(前頁、次頁)のバリデート
function searchValidate(form) {
  // 氏名
  if (!isMaxLenB(form, form.user_name_key, 22, '') ||
    !isProhibitionChar(form, form.user_name_key, '') ) {
    return false;
  }

  // 課支社CD
  if (!isMinLenB(form, form.section_code_key, 3, '') ||
     !isAlphaNumeric(form, form.section_code_key, '') ) {
    return false;
  }

  // 相関入力チェック

  // 氏名
  // 課支社CD
  {
    // 氏名, 課支社CD全て未入力の場合はエラー
    if( isEmptyField(form.user_name_key) &&
      isEmptyField(form.section_code_key)) {

      alert('');
      form.user_name_key.focus();
      return false;
    }
  }

  return true;
}

function custom_Submit(form) {

	// 親画面チェック処理
  windowOpenerClosedCheck();

  // 検索ボタン押下時
  if (clickButtonName == 'search' ||
      clickButtonName == 'nextPage' ||
      clickButtonName == 'prevPage') {

    var form = document.tks_TKSPRForm;

    // メッセージエリアのメッセージをクリア
    document.getElementById('popup_message_area').innerText = ' ';

    var opt = document.getElementById("select_name_list").options;

    // 検索条件のバリデートを実行
    if (searchValidate(form)) {

      // 選択中の送信先情報を保持
      var strValueList = '';
      var strLabelList = '';
      for(i = 0; i < opt.length; i++) {
        if (strValueList != '') {
          strValueList += ',';
          strLabelList += ',';
        }
        strValueList += opt[i].value;
        strLabelList += opt[i].text;
      }

      // メールアドレスの要素生成
      var valueElm = document.createElement("input");
      valueElm.type = "hidden";
      valueElm.name = "valueList";
      valueElm.value = strValueList;

      // ユーザ名の要素生成
      var labelElm = document.createElement("input");
      labelElm.type = "hidden";
      labelElm.name = "labelList";
      labelElm.value = strLabelList;

      // メールアドレスとユーザ名の要素追加
      form.appendChild(valueElm);
      form.appendChild(labelElm);

      // 検索実行
      return true;
    } else {
      // バリデートエラー
      return false;
    }
  }
}

</script>

<script>
/* dynamic buttonName: the popup query carries the opener action (requestApplication/disapprove/approve). */
(function(){
  try {
    var vals = new URLSearchParams(location.search).getAll('1');
    var known = ['requestApplication','disapprove','approve','cancel'];
    var act = vals.find(function(v){ return known.indexOf(v) >= 0; });
    if (!act) act = sessionStorage.getItem('ana11_action');
    var el = document.getElementById('buttonName');
    if (act && el) { el.value = act; sessionStorage.setItem('ana11_action', act); }
  } catch (e) {}
})();
</script>
