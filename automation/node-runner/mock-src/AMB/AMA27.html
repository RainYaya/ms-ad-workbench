<!DOCTYPE html>

<head>

<script>

var parentDoc = window.opener.document;

function custom_Load() {
  // ウィンドウの×ボタンを無効化
  commonPopupBodyOnload();

  var form = document.mhk_MHKPRForm;

  // 検索結果表、頁ボタン表示制御
  var gyoumu_list = document.getElementById('gyoumu_list');
  // 件数0件の場合における検索結果欄の非表示制御
  if ( parseInt(form.totalCount.value) == 0 ) {
    gyoumu_list.style.visibility = "hidden";
  } else {
    gyoumu_list.style.visibility = "visible";
  }
  // 前頁ボタン制御(ページ番号 > 1のみ表示)
  if ( parseInt(form.pageNumber.value) > 1 ) {
    form.prevPage.style.visibility = "visible";
  } else {
    form.prevPage.style.visibility = "hidden";
  }
  // 次頁ボタン制御(ページ総数 > ページ番号のみ表示)
  if ( parseInt(form.totalPage.value) > parseInt(form.pageNumber.value) ) {
    form.nextPage.style.visibility = "visible";
  } else {
    form.nextPage.style.visibility = "hidden";
  }
}

function clickNo(indexNo) {
  var form = document.mhk_MHKPRForm;

  var selectUserId = document.getElementById("user_id_" + indexNo).value;

  var i = 0;

  while (parentDoc.getElementById("addUser:user_id_" + i)) {
    if (parentDoc.getElementById("addUser:user_id_" + i).value == selectUserId) {
      alert("");
      return;
    }
    i++;
  }

  var tableElm = parentDoc.getElementById("list_table");

  // 個別メール通知先一覧に行追加
  var newRow = tableElm.insertRow(-1);

  // メール通知
  var newCell = newRow.insertCell(-1);
  newCell.className = "sticky_table_value txt_aln_c";
  newCell.innerHTML = '<input type="checkbox" id="addUser:user_mail_send_flag_' + i + '" name="addUser:user_mail_send_flag_' + i + '" value="1" checked="checked" />';

  // 部課ｺｰﾄﾞ
  newCell = newRow.insertCell(-1);
  newCell.className = "sticky_table_value txt_aln_c";
  newCell.innerHTML = document.getElementById("section_code_" + indexNo).value;

  // 氏名
  newCell = newRow.insertCell(-1);
  newCell.className = "sticky_table_value";
  newCell.innerHTML = document.getElementById("user_name_" + indexNo).value;

  var sectionCodeHide = parentDoc.createElement("input");
  sectionCodeHide.type = "hidden";
  sectionCodeHide.id = "addUser:section_code_" + i;
  sectionCodeHide.name = "addUser:section_code_" + i;
  sectionCodeHide.value = document.getElementById("section_code_" + indexNo).value;

  newRow.appendChild(sectionCodeHide);

  var userNameHide = parentDoc.createElement("input");
  userNameHide.type = "hidden";
  userNameHide.id = "addUser:user_name_" + i;
  userNameHide.name = "addUser:user_name_" + i;
  userNameHide.value = document.getElementById("user_name_" + indexNo).value;

  newRow.appendChild(userNameHide);

  var userIdHide = parentDoc.createElement("input");
  userIdHide.type = "hidden";
  userIdHide.id = "addUser:user_id_" + i;
  userIdHide.name = "addUser:user_id_" + i;
  userIdHide.value = document.getElementById("user_id_" + indexNo).value;

  newRow.appendChild(userIdHide);
}

function popupClose(button) {
  window.close();
}

// 検索(前頁、次頁)のバリデート
function searchValidate(form) {
  // 氏名
  if (!isMaxLenB(form, form.user_name, 22, '') ||
    !isProhibitionChar(form, form.user_name, '') ) {
    return false;
  }

  // 部店課支社ｺｰﾄﾞ
  if (!isMinLenB(form, form.section_code, 3, '') ||
    !isAlphaNumeric(form, form.section_code, '') ) {
    return false;
  }

  // 相関入力チェック
  // 氏名
  // 部店課支社ｺｰﾄﾞ
  {
    // 氏名, 部店課支社ｺｰﾄﾞ全て未入力の場合はエラー
    if( isEmptyField(form.user_name) && isEmptyField(form.section_code)) {
      alert('');
      form.user_name.focus();
      return false;
    }
  }

  return true;
}

function custom_Submit(form) {

  // 親画面終了チェック
  if (!windowOpenerClosedCheck()) {
    return false;
  }

  // 検索ボタン押下時
  if (clickButtonName == 'search' ||
    clickButtonName == 'nextPage' ||
    clickButtonName == 'prevPage') {
    // メッセージエリアのメッセージをクリア
    document.getElementById('popup_message_area').innerHTML = '&nbsp;';

    // 検索条件のバリデートを実行
    return searchValidate(form);
  }
}
</script>
</head>
