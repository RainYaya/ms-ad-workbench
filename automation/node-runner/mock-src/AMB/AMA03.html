<script>
function onCloseClick() {
	clickButtonName = 'close';
	return closeSubmit(document.mhk_MHKPRForm.close, '');
}

function custom_BodyOnload() {
	commonBodyOnload();
	onChangeLargeItem();

	var searchIndexErrMsg = '1';

	if ( searchIndexErrMsg != '') {
		// 保種の再選択
		var selectedIndex = document.mhk_MHKPRForm.insuranceSelectedIndex.value;
		var insuranceItemObj = document.mhk_MHKPRForm.elements['insurance_item_list.selected'];

		insuranceItemObj.selectedIndex = selectedIndex;
		document.getElementById('insurance_item_title').title = insuranceItemObj.options[selectedIndex].text;

		// 振分検索エラーメッセージ表示
		alert(searchIndexErrMsg);
	}
}

function custom_Submit(form) {

	// 登録時のみバリデートを実行
	if ( clickButtonName == 'regist' ) {
		// Struts(SDE)バリデート実行(Client側)
		if ( formValidate(form) == false ) {
			return false;
		}

		form.insuranceSelectedIndex.value = form.elements['insurance_item_list.selected'].selectedIndex;

		return true;
	}
	else {
		return true;
	}
}

function onChangeInputType(inputTypeObj) {
	// 入力区分 = 契約入力
	if ( inputTypeObj.value == '1' ) {
		document.mhk_MHKPRForm.import_flag.checked = true;
	}
	else {
		document.mhk_MHKPRForm.import_flag.checked = false;
	}
}

function onChangeLargeItem() {
	var		largeItemObj = document.mhk_MHKPRForm.elements['large_item_list.selected'];
	var		insuranceItemObj = document.mhk_MHKPRForm.elements['insurance_item_list.selected'];

	var		i = 0;
	var		j = 0;

	document.getElementById('insurance_item_title').title = '';

	insuranceItemObj.options.length = 1;
	insuranceItemObj.options[j].value = '';
	insuranceItemObj.options[j++].text = '';

	for (i = 0 ; i < insuranceItems.length / 4; i++ ) {
		if ( insuranceItems[i*4+1] == largeItemObj.value ) {
			insuranceItemObj.options.length++;
			insuranceItemObj.options[j].value = insuranceItems[i*4+2] + insuranceItems[i*4+3];
			insuranceItemObj.options[j].title = insuranceItems[i*4+2] + ' ： ' + insuranceItems[i*4+4];
			insuranceItemObj.options[j++].text = insuranceItems[i*4+2] + ' ： ' + insuranceItems[i*4+4];
		}
	}
	document.mhk_MHKPRForm.insurance_item_code.value = insuranceItemObj.value;
}

function onChangeInsuranceItem(insuranceItem) {
	var		selectedIndex = insuranceItem.selectedIndex;
	if ( selectedIndex >= 0 ) {
		document.getElementById('insurance_item_title').title = insuranceItem.options[selectedIndex].text;
	}
}

// 保種選択画面
function onClickSelectInsurance() {
	var largeItemObj = document.mhk_MHKPRForm.elements['large_item_list.selected'];
	var selectedIndex = largeItemObj.selectedIndex;

	if ( selectedIndex <= 0 ) {
		return;
	}

	// 子画面開閉チェック
	subWinOpenCheck();

	var	insuranceItemObj = document.mhk_MHKPRForm.elements['insurance_item_list.selected'];

	var url = new URL("/AMB/insurance_item_select.html", window.location.origin);
	showPopup(url.href, "insurance_item_select", "1");
}

// 募集人検索画面
function popupAZG905() {
	var form            = document.mhk_MHKPRForm;
	var sectionCode     = form.section_code.value;
	var agentCode       = form.agent_code.value;
	var fieldAgentId    = form.field_agent_id.value;
	var firstSearchFlag = '0';

	// 子画面開閉チェック
	subWinOpenCheck();

	// 募集人検索画面表示前の入力チェック
	if ( formValidateForPopupAZG905(form) ) {
		firstSearchFlag = '1';
	}

	var param = '1' + '=' + sectionCode
				+ '&' + '1' + '=' + agentCode
				+ '&' + '1' + '=' + fieldAgentId
				+ '&' + '1' + '=' + firstSearchFlag
				+ '&gamid=AMA18&gamcd=AMA00&hubsessid=1';

	var url = new URL('/AMB/AMA18.html', window.location.origin);
	var params = new URLSearchParams(param)
	url.search = params.toString();

	showPopup(url.href, "AMA18", "1");
}

function formValidate(form) {
	var inputTypeObj	= form.elements['input_type_list.selected'];
	var largeItemObj	= form.elements['large_item_list.selected'];
	var insuranceItemObj= form.elements['insurance_item_list.selected'];
	var appFormTypeObj	= form.elements['application_form_type_list.selected'];
	var sumupStatusObj	= form.elements['sumup_status_list.selected'];

	// 入力区分の必須チェック
	if ( !isRequired(form, inputTypeObj, '') ) {
		return false;
	}

	// 大種目の必須チェック
	if ( !isRequired(form, largeItemObj, '') ) {
		return false;
	}

	// 証券番号の必須チェック&半角英数チェック
	if ( !isRequired(form, form.policy_number, '') ||
		 !isAlphaNumeric(form, form.policy_number, '') ) {
		return false;
	}

	// 明細番号の半角英数チェック
	if ( !isAlphaNumeric(form, form.sub_policy_number, '') ) {
		return false;
	}

	// 募集人IDの半角英数チェック
	if ( !isAlphaNumeric(form, form.field_agent_id, '') ) {
		return false;
	}

	// 契約者名の最大バイト数＆記号チェック
	if (!isMaxLenB(form, form.insurant_name, 120, '') ||
		!isProhibitionChar(form, form.insurant_name, '') ) {
		return false;
	}

	// 課支社CD 最小文字数＆半角英数チェック
	if ( !isMinLenB(form, form.section_code, 3, '') ||
		 !isAlphaNumeric(form, form.section_code, '') ) {
		return false;
	}

	// 代理店CD 半角英数チェック
	if ( !isAlphaNumeric(form, form.agent_code, '') ) {
		return false;
	}

	// サブの半角チェック＆記号チェック
	if (!isAllHankaku(form, form.sub_agent_code, '') ||
		!isProhibitionChar(form, form.sub_agent_code, '') ) {
		return false;
	}

	// フリーコード1の半角チェック
	if ( !isAllHankaku(form, form.free_code_1, '') ) {
	     return false;
	}

	// 保険始期日
	if ( !isValidDateYMD(form, form.start_date, '') ) {
		return false;
	}

	// 変更日
	if ( !isValidDateYMD(form, form.change_date, '') ) {
		return false;
	}

	// 新更変・他の必須チェック
	if ( !isRequired(form, appFormTypeObj, '') ) {
		return false;
	}

	// 計上年月のチェック
	if ( !isValidYearMonth(form, form.sumup_year_month, '') ) {
		return false;
	}

	// 日報送付の半角英数チェック
	if ( !isAlphaNumeric(form, form.daily_report_send, '') ) {
		return false;
	}

	// 日報部課代CD 半角英数チェック
	if ( !isMinLenB(form, form.sumup_section_code, 3, '') ||
		  !isAlphaNumeric(form, form.sumup_section_code, '') ) {
		return false;
	}

	// 計上状態の必須チェック
	if ( !isRequired(form, sumupStatusObj, '') ) {
		return false;
	}

	// 督促日の日付チェック
	if ( !isRequired(form, form.reminder_date, '') ||
		 !isValidDateYMD(form, form.reminder_date, '') ) {
		return false;
	}

	// 入力区分のチェック(大種目が0の時のみ)
	if ( largeItemObj.value == '0' ) {
		if ( inputTypeObj.value != '9' ) {
			showValidateMessage(form, inputTypeObj, '');
			return false;
		}
	}

	// 保種の必須チェック(大種目が5、7の時のみ)
	if(form.company_kbn.value == 'AD'){
		if ( largeItemObj.value == '5' || largeItemObj.value == '7' ) {
			if ( !isRequired(form, insuranceItemObj, '') ) {
				return false;
			}
		}
	}

	// 保種の必須チェック(大種目が5、7、X の時)
	if(form.company_kbn.value == 'MS'){
		if ( largeItemObj.value == '5' || largeItemObj.value == '7'  || largeItemObj.value == 'X' ) {
			if ( !isRequired(form, insuranceItemObj, '') ) {
				return false;
			}
		}
	}

	// 課支社CD、代理店CD、計上年月の必須チェック(契約マスタ引き込み時以外)
	if ( !form.import_flag.checked ) {
		// 課支社CDの必須チェック
		if ( !isRequired(form, form.section_code, '') ) {
			return false;
		}
		// 代理店CDの必須チェック
		if ( !isRequired(form, form.agent_code, '') ) {
			return false;
		}
		// 計上年月の必須チェック
		if ( !isRequired(form, form.sumup_year_month, '') ) {
			return false;
		}
	}
	// 督促日<登録日のチェック
	var		registrationDate = '1';

	if (form.reminder_date.value < registrationDate) {
		showValidateMessage(form, form.reminder_date, '');
		return false;
	}

	// 入力区分のチェック(大種目がZの時のみ)
	if ( largeItemObj.value == 'Z' ) {
		if ( inputTypeObj.value != '5' && inputTypeObj.value != '7') {
			showValidateMessage(form, inputTypeObj, '');
			return false;
		}
	}

	return true;
}

// 入力区分の選択値を設定
function setInputTypeSelect(obj) {
	document.mhk_MHKPRForm.input_type_code.value = obj.value;
}

//大種目の選択値を設定
function setLargeItemSelect(obj) {
	document.mhk_MHKPRForm.large_item_code.value = obj.value;

// 保種の選択値を設定
function setInsuranceItemSelect(obj) {

}

// 新更変・他の選択値を設定
function setApplicationFormTypeSelect(obj) {
	document.mhk_MHKPRForm.application_form_type.value = obj.value;
}

//計上状態の選択値を設定
function setSumupStatusSelect(obj) {
	document.mhk_MHKPRForm.sumup_status.value = obj.value;
}
</script>
