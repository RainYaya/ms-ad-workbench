<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<link rel="stylesheet" type="text/css" href="/static/css/mhk.css"/>

<script>

function showMessage(){

	var form = document.mhk_MHKPRForm;

	var arg_Message = document.getElementById('msg').children[0].innerHTML;

	parent.document.getElementById('err_msg').innerHTML = arg_Message;

	parent.document.getElementById('gyoumu_area').style.visibility = 'hidden';

	parent.document.getElementById('Print').style.visibility = 'hidden';
	parent.document.getElementById('CopyClipboard').style.visibility = 'hidden';

}

</script>

    <input type="hidden" id="gamid"        name="gamid"        value="AMAZS" />
    <input type="hidden" id="hubsessid"    name="hubsessid" />

</body>
