# AZ-150-05-001  親子集計バッチ処理（正常終了） / 集計（日次）
#
# 新 schema（docs/rpa/11-KERNEL.md）。これは「バッチ（ブラウザ外）」型の検証用。
# 手順は 3 行だけで、画面操作が無い:
#   14 バッチ実行 → 15 操作結果 → 16 APログ（エラー件数0件）
