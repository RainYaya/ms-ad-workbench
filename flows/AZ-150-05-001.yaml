#
# 実施前提（別紙）: AZ-150-07-001 と AZ-140-01-001 で集計データ登録が完了していること。

case: AZ-150-05-001
mode: external
title: 親子集計バッチ処理（正常終了）
pointCheck: 集計（日次）
evidencePolicy: none

steps:
  - row: 14
    do: manual
    note: 親子集計バッチ処理を実行する（ブラウザ操作なし）。実行コマンド/JP1 は環境依存。

  - row: 15
    do: externalIs
    expect:
      external: {type: 操作結果, note: "正常終了（-）。手順の期待は『-』"}

  - row: 16
    do: externalIs
    expect:
      external: {type: APログ, note: エラー件数が0件であること}
