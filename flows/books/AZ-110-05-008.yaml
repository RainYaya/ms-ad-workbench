case: AZ-110-05-008
title: シナリオ導線５
user: MS
pointCheck: AZ-110
evidencePolicy: required

start:
  screen: 申込書品質管理メニュー画面
  url: /AMB/AMA01.html

env: prod-a

values:
  入力区分:       {value: 現地,        source: case, row: 6}
  契約マスタ:     {value: false,        source: literal, row: 7, note: "別紙「連動しない」= OFF（checkbox 只收布尔）"}
  種目:           {value: 自動車,      source: case, row: 8}
  保険種類:       {value: '11：クルマの保険／はじめての自動車保険', source: case, row: 9}
  証券番号:       {value: AZ11005,     source: case, row: 10}
  明細番号:       {value: '0000000037', source: case, row: 11}
  部店課支社コード: {value: "${env.部店課支社コード}", source: env}
  代理店コード:   {value: "${env.代理店コード}", source: env}
  サブコード:     {value: '123456',    source: case, row: 14}
  フリーコード:   {value: '1234567890', source: case, row: 15}
  募集人ID:       {value: '3028004586', source: case, row: 16}
  契約者名:       {value: TEST,        source: case, row: 17}
  保険始期日:     {value: '2026/11/01', source: case, row: 18}
  新更変・他:     {value: 新規,        source: case, row: 20}
  計上年月:       {value: '2026/11',   source: case, row: 21}
  日報／送付:     {value: 1234567890AB, source: case, row: 22}
  日報部課代ｺｰﾄﾞ: {value: ABC012,     source: case, row: 23}
  計上状態:       {value: 未計上,      source: case, row: 24}
  回答締切日:     {value: "${sys.today+7d}", source: sys}
  項目コード:     {value: T0,          source: case, row: 26}
  照会コード:     {value: T007,        source: case, row: 27}
  項目名:         {value: 'T0：損保取引確認書', source: case, row: 28}
  照会内容:       {value: 'T007：「損保取引確認書」の添付がもれています。', source: case, row: 29}
  不備内容:       {value: 添付書類もれ, source: case, row: 30}
  編集照会内容:   {value: 編集済み。,   source: case, row: 31}
  確認者:         {value: TEST,        source: case, row: 32}
  確認日・確認時刻: {value: "${sys.now}", source: sys}
  確認相手:       {value: 確認相手TEST, source: case, row: 34}
  確認相手の電話番号: {value: '',      source: blank, row: 35}
  電話番号チェック: {value: true,      source: case, row: 36}
  訂正項目:       {value: 訂正項目１,   source: case, row: 37}
  訂正内容:       {value: 訂正内容１,   source: case, row: 38}
  eメールチェック: {value: false,      source: case, row: 39}

steps:
  - row: 14
    on: 申込書品質管理メニュー画面
    do: click
    target: {label: 新規登録}

  - row: 15
    on: 不備内容入力画面－新規
    do: screenIs
    evidence: 画面HC

  - row: 16
    on: 不備内容入力画面－新規
    do: fillAll
    use:
      - 入力区分
      - 契約マスタ
      - 種目
      - 証券番号
      - 明細番号
      - 部店課支社コード
      - 代理店コード
      - サブコード
      - フリーコード
      - 契約者名
      - 保険始期日
      - 新更変・他
      - 計上年月
      - 日報／送付
      - 日報部課代ｺｰﾄﾞ
      - 計上状態
    note: 別紙【操作内容】1。保険種類/募集人ID は各検索画面、回答締切日は初期値、変更日は入力なし

  - row: 17
    on: 不備内容入力画面－新規
    do: click
    target: {label: "....", qualifier: 保険種類欄の横}

  - row: 18
    on: 保険種類選択画面
    popup: true
    do: screenIs
    evidence: 画面HC

  - row: 19
    on: 保険種類選択画面
    popup: true
    do: select
    target: {label: 保険種類}
    value: "${case.保険種類}"

  - row: 20
    on: 保険種類選択画面
    popup: true
    do: click
    target: {label: OK}

  - row: 21
    on: 不備内容入力画面-新規
    do: screenIs
    evidence: 画面HC

  - row: 22
    on: 不備内容入力画面-新規
    do: click
    target: {label: "....", qualifier: 募集人ID欄の横}

  - row: 23
    on: 募集人検索画面
    popup: true
    do: screenIs
    evidence: 画面HC

  - row: 24
    on: 募集人検索画面
    popup: true
    do: fill
    target: {label: 部店課支社コード}
    value: "${env.部店課支社コード}"

  - row: 25
    on: 募集人検索画面
    popup: true
    do: click
    target: {label: 検索}

  - row: 26
    on: 募集人検索画面
    popup: true
    do: screenIs
    evidence: 画面HC

  - row: 27
    on: 募集人検索画面
    popup: true
    do: chooseRow
    target:
      label: 選択欄ラジオボタン
      anchor: "${case.募集人ID}"

  - row: 28
    on: 募集人検索画面
    popup: true
    do: click
    target: {label: 選択}

  - row: 29
    on: 不備内容入力画面-新規
    do: screenIs
    evidence: 画面HC

  - row: 30
    on: 不備内容入力画面－新規
    do: click
    target: {label: 登録}
    expect: {screen: 不備内容入力画面-更新}

  - row: 31
    on: 不備内容入力画面-更新
    do: screenIs
    evidence: 画面HC
    expect:
      ref: {appendix: 表示内容１, status: unresolved, note: 別紙表示内容1。値の突合は未実装}

  - row: 32
    on: 不備内容入力画面-更新
    do: click
    target: {label: 検索}
    note: 登録直後の不備行の検索。行はまだ空なので flows/overrides で先頭行を指定

  - row: 33
    on: 項目名検索画面
    popup: true
    do: screenIs
    evidence: 画面HC

  - row: 34
    on: 項目名検索画面
    popup: true
    do: fillAll
    use: [項目コード, 照会コード]
    note: 別紙【操作内容】2

  - row: 35
    on: 項目名検索画面
    popup: true
    do: click
    target: {label: 検索}

  - row: 36
    on: 項目名検索画面
    popup: true
    do: screenIs
    evidence: 画面HC
    expect:
      ref: {appendix: 表示内容２, status: unresolved, note: 別紙表示内容2}

  - row: 37
    on: 項目名検索画面
    popup: true
    do: chooseRow
    target:
      label: 各項目の選択
      anchor: "${case.項目コード}"
    note: 結果は option 一覧。項目コード T0 で選ぶ（T01 には一致しない）

  - row: 38
    on: 項目名検索画面
    popup: true
    do: click
    target: {label: 選択}

  - row: 39
    on: 不備内容入力画面-更新
    do: screenIs
    evidence: 画面HC
    expect:
      ref: {appendix: 表示内容３, status: unresolved, note: 別紙表示内容3}

  - row: 40
    on: 不備内容入力画面-更新
    do: check
    target:
      label: 照会内容チェックボックス
      anchor: "${case.不備内容}"
    value: true

  - row: 41
    on: 不備内容入力画面-更新
    do: click
    target:
      label: 修
      anchor: "${case.不備内容}"

  - row: 42
    on: 照会内容編集画面
    popup: true
    do: screenIs
    evidence: 画面HC

  - row: 43
    on: 照会内容編集画面
    popup: true
    do: fill
    target: {label: 編集照会内容}
    value: "${case.編集照会内容}"

  - row: 44
    on: 照会内容編集画面
    popup: true
    do: click
    target: {label: OK}

  - row: 45
    on: 不備内容入力画面-更新
    do: screenIs
    evidence: 画面HC
    expect:
      ref: {appendix: 表示内容４, status: unresolved, note: 別紙表示内容4}

  - row: 46
    on: 不備内容入力画面-更新
    do: select
    target:
      label: 代理店照会
      anchor: "${case.不備内容}"
    value: 否

  - row: 47
    on: 不備内容入力画面-更新
    do: click
    target: {label: 訂正内容確認書}

  - row: 48
    on: 訂正内容確認画面
    popup: true
    do: screenIs
    evidence: 画面HC

  - row: 49
    on: 訂正内容確認画面
    popup: true
    do: fillAll
    use:
      - 確認者
      - 確認日・確認時刻
      - 確認相手
      - 電話番号チェック
      - 訂正項目
      - 訂正内容
      - eメールチェック
    note: 別紙【操作内容】5。確認相手の電話番号は「空白」なので入力しない

  - row: 50
    on: 訂正内容確認画面
    popup: true
    do: click
    target: {label: 登録}
    expect: {screen: 不備内容入力画面-更新}

  - row: 51
    on: 不備内容入力画面-更新
    do: screenIs
    evidence: 画面HC
    expect:
      ref: {appendix: 表示内容５, status: unresolved, note: 別紙表示内容5}

  - row: 52
    on: 不備内容入力画面-更新
    do: click
    target: {label: 営業連携}

  # 手顺没有「遷移」到通知先画面：弹窗不是手顺画面。on 仍然是更新画面，
  # popupScreen 告诉编译器标签去哪个画面查。
  - row: 53
    on: 不備内容入力画面-更新
    popup: true
    popupScreen: メール通知先選択画面
    do: click
    target: {label: 通知しない}

  - row: 54
    on: 不備内容入力画面-更新
    popup: true
    popupScreen: メール通知先選択画面
    do: click
    target: {label: OK}
    note: 通知しない 押下時に出る confirm ダイアログの OK

  - row: 55
    on: 不備内容入力画面-更新
    do: screenIs
    evidence: 画面HC
    expect:
      ref: {appendix: 表示内容６, status: unresolved, note: 別紙表示内容6}
